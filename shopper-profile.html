<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopper Profile — BuyForMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/buyer-theme.css">
    <link rel="stylesheet" href="css/buyer-shell.css">
    <link rel="stylesheet" href="css/shoppers-profile.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>

<body class="buyer-app profile-page">

    <div id="buyer-content">
        <div class="profile-banner" id="profileBanner"></div>
        <div class="page-container profile-page-inner">
            <div class="profile-intro">
                <div class="profile-avatar" id="profileAvatar">—</div>
                <div class="profile-intro-text">
                    <h1 id="profileName">Loading...</h1>
                    <p class="profile-location" id="profileLocation"></p>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-box"><span class="val" id="statRating">—</span><span class="lbl">Rating</span></div>
                <div class="stat-box"><span class="val" id="statReviews">—</span><span class="lbl">Reviews</span></div>
                <div class="stat-box"><span class="val" id="statOrders">—</span><span class="lbl">Orders</span></div>
                <div class="stat-box"><span class="val" id="statYears">—</span><span class="lbl">Years</span></div>
            </div>

            <div class="profile-layout">
                <div>
                    <div class="card buyer-card"><h3><i class="fas fa-user"></i> About</h3><p id="profileAbout"></p></div>
                    <div class="card buyer-card profile-videos-card" id="profileVideosCard" style="display:none">
                        <h3><i class="fas fa-video"></i> Videos</h3>
                        <p class="profile-videos-sub">See this shopper in action</p>
                        <div class="profile-videos-grid" id="profileVideos"></div>
                    </div>
                    <div class="card buyer-card"><h3><i class="fas fa-tags"></i> Services</h3><div class="tags-container" id="profileTags"></div></div>
                    <div class="card buyer-card"><h3><i class="fas fa-map-marker-alt"></i> Trips</h3><div id="profileTrips"></div></div>
                    <div class="card buyer-card">
                        <h3><i class="fas fa-star"></i> Reviews <span id="reviewCount" class="count-pill"></span></h3>
                        <div id="profileReviews"></div>
                    </div>
                </div>
                <aside class="profile-sidebar-col">
                    <div class="action-card buyer-card">
                        <p class="fee-label">Service fee</p>
                        <div class="fee-amount" id="profileFee">—</div>
                        <p class="fee-sub">of item cost</p>
                        <button type="button" class="btn-request btn-pill btn-pill--primary" id="btnRequest" onclick="handleRequest()">
                            <i class="fas fa-shopping-bag"></i> Request purchase
                        </button>
                        <button type="button" class="btn-message btn-pill btn-pill--secondary" id="btnMessage" onclick="handleMessage()">
                            <i class="fas fa-comment"></i> Message
                        </button>
                        <hr class="divider">
                        <div class="sidebar-stat-row"><span>Response</span><span id="sidebarResponse">—</span></div>
                        <div class="sidebar-stat-row"><span>Completion</span><span id="sidebarCompletion">—</span></div>
                        <div class="sidebar-stat-row"><span>Since</span><span id="sidebarSince">—</span></div>
                        <div class="trust-badges">
                            <div class="trust-item"><i class="fas fa-shield-halved"></i> Identity verified</div>
                            <div class="trust-item" id="trustPhone"></div>
                        </div>
                    </div>
                </aside>
            </div>
        </div>

        <div class="profile-mobile-cta">
            <button type="button" class="btn-pill btn-pill--secondary" onclick="handleMessage()"><i class="fas fa-comment"></i></button>
            <button type="button" class="btn-pill btn-pill--primary" onclick="handleRequest()"><i class="fas fa-shopping-bag"></i> Request</button>
        </div>
    </div>

    <script type="module" src="css/js/profile.js"></script>
</body>

</html>
