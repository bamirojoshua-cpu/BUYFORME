<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | BuyForMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/buyer-theme.css">
    <link rel="stylesheet" href="css/buyer-shell.css">
    <link rel="stylesheet" href="css/buyer-orders.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="icon" href="images/logo.png" type="image/png">
    <script src="https://js.paystack.co/v1/inline.js"></script>
</head>

<body class="buyer-app" data-buyer-tab="orders">

    <div id="buyer-content">
        <header class="buyer-page-head buyer-animate-in">
            <h1>My orders</h1>
            <p id="pageSubtitle">Track purchases and pay when your shopper accepts</p>
        </header>

        <div class="orders-filter-tabs buyer-animate-in">
            <button type="button" class="chip-pill active" onclick="filterOrders('all', this)">All</button>
            <button type="button" class="chip-pill" onclick="filterOrders('active', this)">Active</button>
            <button type="button" class="chip-pill" onclick="filterOrders('delivering', this)">In transit</button>
            <button type="button" class="chip-pill" onclick="filterOrders('delivered', this)">Delivered</button>
            <button type="button" class="chip-pill" onclick="filterOrders('pending', this)">Pending</button>
        </div>

        <p class="orders-meta" id="ordersMeta"></p>
        <div class="orders-list" id="ordersList"></div>
    </div>

    <div class="processing-overlay" id="processingOverlay">
        <div class="processing-box">
            <div class="processing-spinner"></div>
            <h3>Confirming payment…</h3>
            <p>Please wait — do not close this page.</p>
        </div>
    </div>

    <div class="review-modal" id="reviewModal">
        <div class="review-modal__panel">
            <button type="button" class="review-modal__close" onclick="closeReviewModal()" aria-label="Close"><i class="fas fa-xmark"></i></button>
            <h3 style="font-family:Sora,sans-serif;margin-bottom:6px">Leave a review</h3>
            <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:16px">for <strong id="reviewShopperName"></strong></p>
            <p class="buyer-label">Rating</p>
            <div class="star-picker" id="starPicker">
                <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
            </div>
            <label class="buyer-label" for="reviewText">Your review</label>
            <textarea id="reviewText" class="buyer-textarea" rows="4" placeholder="Describe your experience…"></textarea>
            <p id="reviewError" style="font-size:0.82rem;color:var(--red);margin:12px 0;display:none"></p>
            <button type="button" class="btn-pill btn-pill--primary" style="width:100%" id="reviewSubmitBtn" onclick="submitReview()">Submit review</button>
        </div>
    </div>

    <div class="buyer-toast" id="buyerToast" role="status"></div>
    <script type="module" src="css/js/my-orders.js"></script>
</body>

</html>
