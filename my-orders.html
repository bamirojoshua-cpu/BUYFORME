<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | BuyForMe</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="icon" href="images/logo.png" type="image/png">
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --green: #1a9e6e;
            --green-dark: #127a54;
            --green-light: #e6f7f1;
            --amber: #f59e0b;
            --amber-light: #fef3c7;
            --blue: #3b82f6;
            --blue-light: #dbeafe;
            --red: #ef4444;
            --red-light: #fee2e2;
            --gray-light: #f3f4f6;
            --gray: #6b7280;
            --text: #0f1c18;
            --text-muted: #5a7268;
            --border: #dde8e4;
            --bg: #f4f8f6;
            --white: #ffffff;
            --radius: 14px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh
        }

        .navbar {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100
        }

        .logo {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--green);
            text-decoration: none;
            letter-spacing: -0.5px
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.15s
        }

        .back-link:hover {
            border-color: var(--green);
            color: var(--green)
        }

        .page {
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 24px 60px
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px
        }

        .page-header h1 {
            font-family: 'Sora', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px
        }

        .page-header p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 4px
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap
        }

        .filter-tab {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--white);
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif
        }

        .filter-tab:hover {
            border-color: var(--green);
            color: var(--green)
        }

        .filter-tab.active {
            background: var(--green);
            border-color: var(--green);
            color: white
        }

        .orders-meta {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 16px
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        .order-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 24px;
            transition: box-shadow 0.15s
        }

        .order-card:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07)
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px
        }

        .order-product {
            font-family: 'Sora', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: -0.3px
        }

        .order-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap
        }

        .order-meta span {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%
        }

        .status-pending {
            background: var(--amber-light);
            color: #92400e
        }

        .status-pending .status-dot {
            background: var(--amber)
        }

        .status-accepted {
            background: var(--blue-light);
            color: #1e40af
        }

        .status-accepted .status-dot {
            background: var(--blue)
        }

        .status-paid {
            background: var(--green-light);
            color: var(--green-dark)
        }

        .status-paid .status-dot {
            background: var(--green)
        }

        .status-purchased {
            background: var(--green-light);
            color: var(--green-dark)
        }

        .status-purchased .status-dot {
            background: var(--green)
        }

        .status-delivering {
            background: #ede9fe;
            color: #5b21b6
        }

        .status-delivering .status-dot {
            background: #8b5cf6;
            animation: pulse 1.5s infinite
        }

        .status-delivered {
            background: var(--gray-light);
            color: #374151
        }

        .status-delivered .status-dot {
            background: var(--gray)
        }

        .status-cancelled {
            background: var(--red-light);
            color: #991b1b
        }

        .status-cancelled .status-dot {
            background: var(--red)
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.4
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px)
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0)
            }
        }

        .order-progress {
            margin-bottom: 16px
        }

        .progress-steps {
            display: flex;
            align-items: center
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
            position: relative
        }

        .progress-step::after {
            content: '';
            position: absolute;
            top: 11px;
            left: 50%;
            right: -50%;
            height: 2px;
            background: var(--border);
            z-index: 0
        }

        .progress-step:last-child::after {
            display: none
        }

        .progress-step.done::after {
            background: var(--green)
        }

        .step-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: var(--text-muted);
            z-index: 1;
            transition: all 0.3s
        }

        .progress-step.done .step-dot {
            background: var(--green);
            border-color: var(--green);
            color: white
        }

        .progress-step.active .step-dot {
            border-color: var(--green);
            color: var(--green);
            box-shadow: 0 0 0 3px var(--green-light)
        }

        .step-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 2px;
            white-space: nowrap
        }

        .progress-step.done .step-label {
            color: var(--green-dark);
            font-weight: 500
        }

        .progress-step.active .step-label {
            color: var(--green);
            font-weight: 600
        }

        .order-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            align-items: center
        }

        .btn-pay {
            padding: 9px 20px;
            background: var(--amber);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px
        }

        .btn-pay:hover {
            background: #d97706
        }

        .btn-review {
            padding: 9px 20px;
            background: var(--amber-light);
            color: #92400e;
            border: 1px solid #fcd34d;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px
        }

        .btn-review:hover {
            background: #fde68a
        }

        .order-date {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text-muted)
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted)
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px
        }

        .empty-state h3 {
            font-family: 'Sora', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text)
        }

        .empty-state p {
            font-size: 0.88rem;
            margin-bottom: 24px;
            line-height: 1.6
        }

        .btn-browse {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--green);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            transition: background 0.15s
        }

        .btn-browse:hover {
            background: var(--green-dark)
        }

        .processing-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2000;
            align-items: center;
            justify-content: center
        }

        .processing-overlay.show {
            display: flex
        }

        .processing-box {
            background: white;
            border-radius: 16px;
            padding: 36px 40px;
            text-align: center;
            max-width: 320px;
            width: 90%
        }

        .processing-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--green-light);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px
        }

        .processing-box h3 {
            font-family: 'Sora', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 6px
        }

        .processing-box p {
            font-size: 0.82rem;
            color: var(--text-muted)
        }

        @media(max-width:600px) {
            .navbar {
                padding: 0 16px
            }

            .page {
                padding: 24px 16px 40px
            }

            .order-top {
                flex-direction: column
            }

            .order-actions {
                flex-direction: column
            }

            .btn-pay,
            .btn-review {
                width: 100%;
                justify-content: center
            }

            .order-date {
                margin-left: 0
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="brand-link logo"><img src="images/logo.png" alt="BuyForMe" class="brand-logo"></a>
        <a href="buyers.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </nav>

    <div class="page">
        <div class="page-header">
            <div>
                <h1>My Orders</h1>
                <p id="pageSubtitle">All your purchases in one place</p>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterOrders('all', this)">All Orders</button>
            <button class="filter-tab" onclick="filterOrders('active', this)">Active</button>
            <button class="filter-tab" onclick="filterOrders('delivering', this)">In Transit</button>
            <button class="filter-tab" onclick="filterOrders('delivered', this)">Delivered</button>
            <button class="filter-tab" onclick="filterOrders('pending', this)">Pending</button>
        </div>

        <div class="orders-meta" id="ordersMeta"></div>
        <div class="orders-list" id="ordersList"></div>
    </div>

    <div class="processing-overlay" id="processingOverlay">
        <div class="processing-box">
            <div class="processing-spinner"></div>
            <h3>Confirming Payment...</h3>
            <p>Please wait, do not close this page.</p>
        </div>
    </div>

    <!-- REVIEW MODAL -->
    <div id="reviewModal"
        style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
        <div style="background:white;border-radius:16px;padding:32px;max-width:480px;width:90%;position:relative">
            <button onclick="closeReviewModal()"
                style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#5a7268">✕</button>
            <h3 style="font-family:'Sora',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:6px">Leave a Review
            </h3>
            <p style="font-size:0.85rem;color:#5a7268;margin-bottom:20px">for <strong id="reviewShopperName"></strong>
            </p>
            <div style="margin-bottom:20px">
                <p
                    style="font-size:0.78rem;font-weight:500;color:#5a7268;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">
                    Your Rating</p>
                <div id="starPicker" style="display:flex;gap:8px;font-size:1.8rem;cursor:pointer">
                    <span onclick="setStars(1)" style="color:#dde8e4">★</span>
                    <span onclick="setStars(2)" style="color:#dde8e4">★</span>
                    <span onclick="setStars(3)" style="color:#dde8e4">★</span>
                    <span onclick="setStars(4)" style="color:#dde8e4">★</span>
                    <span onclick="setStars(5)" style="color:#dde8e4">★</span>
                </div>
            </div>
            <div style="margin-bottom:20px">
                <p
                    style="font-size:0.78rem;font-weight:500;color:#5a7268;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">
                    Your Review</p>
                <textarea id="reviewText" rows="4" placeholder="Describe your experience with this shopper..."
                    style="width:100%;padding:10px 14px;border:1.5px solid #dde8e4;border-radius:9px;font-size:0.9rem;font-family:'Inter',sans-serif;outline:none;resize:vertical"></textarea>
            </div>
            <div id="reviewError" style="font-size:0.82rem;color:#ef4444;margin-bottom:12px;display:none"></div>
            <button onclick="submitReview()" id="reviewSubmitBtn"
                style="width:100%;padding:13px;background:#1a9e6e;color:white;border:none;border-radius:9px;font-size:0.92rem;font-weight:700;cursor:pointer;font-family:'Sora',sans-serif">
                Submit Review
            </button>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./css/js/supabase.js";
        import { PAYSTACK_PUBLIC_KEY } from "./css/js/config.js";

        /* ─── STATE ─── */
        let currentUser = null;
        let allOrders = [];
        let activeFilter = "all";
        let paymentInProgress = false;
        let selectedStars = 0;
        let selectedShopperId = null;
        let selectedShopperName = null;
        let realtimeChannel = null;

        /* ─── STATUS CONFIG ─── */
        const statusConfig = {
            pending: { label: "Request Sent", class: "status-pending", step: 0 },
            accepted: { label: "Accepted", class: "status-accepted", step: 1 },
            paid: { label: "Paid", class: "status-paid", step: 2 },
            purchased: { label: "Purchased", class: "status-purchased", step: 3 },
            delivering: { label: "In Transit", class: "status-delivering", step: 4 },
            delivered: { label: "Delivered", class: "status-delivered", step: 5 },
            cancelled: { label: "Cancelled", class: "status-cancelled", step: -1 }
        };

        const progressSteps = ["Request Sent", "Accepted", "Paid", "Purchased", "In Transit", "Delivered"];

        /* ─── AUTH + INIT ─── */
        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = "auth.html"; return; }

            const { data: profile } = await supabase
                .from("users").select("*").eq("uid", session.user.id).maybeSingle();

            currentUser = profile;

            await loadOrders();
            subscribeRealtime();
        }

        /* ─── LOAD ORDERS ─── */
        async function loadOrders() {
            const { data, error } = await supabase
                .from("requests").select("*")
                .eq("buyer_id", currentUser.uid)
                .order("created_at", { ascending: false });

            if (error) { console.error("Load orders error:", error); allOrders = []; }
            else { allOrders = data || []; }
            renderOrders();
        }
        window.loadOrders = loadOrders;

        /* ─── REALTIME ───────────────────────────────────────────────
           Listens for any status update on this buyer's orders and
           re-renders automatically — no refresh needed.
        ──────────────────────────────────────────────────────────── */
        function subscribeRealtime() {
            if (realtimeChannel) supabase.removeChannel(realtimeChannel);

            realtimeChannel = supabase
                .channel("buyer-orders-" + currentUser.uid)
                .on(
                    "postgres_changes",
                    {
                        event: "UPDATE",
                        schema: "public",
                        table: "requests",
                        filter: `buyer_id=eq.${currentUser.uid}`
                    },
                    async (payload) => {
                        const updated = payload.new;

                        // Update just this order in the local array
                        const idx = allOrders.findIndex(o => o.id === updated.id);
                        if (idx !== -1) allOrders[idx] = updated;
                        else allOrders.unshift(updated);

                        renderOrders();
                        showStatusToast(updated.status, updated.product_name);
                    }
                )
                .subscribe();
        }

        function showStatusToast(status, product) {
            const messages = {
                accepted: `✅ Your request for "${product}" was accepted!`,
                paid: `💳 Payment confirmed for "${product}"`,
                purchased: `🛍️ Your shopper bought "${product}"`,
                delivering: `🚚 "${product}" is on its way!`,
                delivered: `🎉 "${product}" has been delivered!`,
            };
            const msg = messages[status];
            if (!msg) return;

            const old = document.getElementById("statusToast");
            if (old) old.remove();

            const toast = document.createElement("div");
            toast.id = "statusToast";
            toast.style.cssText = `
                position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
                background:#1a9e6e;color:white;padding:13px 24px;border-radius:10px;
                font-size:0.88rem;font-weight:600;font-family:'Inter',sans-serif;
                z-index:3000;box-shadow:0 4px 20px rgba(26,158,110,0.3);
                white-space:nowrap;
            `;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = "opacity 0.4s";
                toast.style.opacity = "0";
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        /* ─── FILTER ─── */
        window.filterOrders = function (filter, btn) {
            activeFilter = filter;
            document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
            btn.classList.add("active");
            renderOrders();
        };

        /* ─── RENDER ─── */
        function renderOrders() {
            const filtered = activeFilter === "all"
                ? allOrders
                : allOrders.filter(o => {
                    if (activeFilter === "active")
                        return ["accepted", "paid", "purchased", "delivering"].includes(o.status);
                    return o.status === activeFilter;
                });

            const list = document.getElementById("ordersList");
            const meta = document.getElementById("ordersMeta");
            if (meta) meta.textContent = `${filtered.length} order${filtered.length !== 1 ? "s" : ""}`;

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📦</div>
                        <h3>No orders here</h3>
                        <p>You don't have any orders in this category yet.</p>
                        <a href="buyers.html" class="btn-browse"><i class="fas fa-search"></i> Browse Shoppers</a>
                    </div>`;
                return;
            }

            list.innerHTML = filtered.map(order => buildOrderCard(order)).join("");
        }

        function buildOrderCard(order) {
            const config = statusConfig[order.status] || statusConfig.pending;
            const stepIdx = config.step;
            const total = order.total_amount ? order.total_amount : order.budget * 1.15;
            const canPay = order.status === "accepted";
            const isDelivered = order.status === "delivered";

            const progressHTML = order.status !== "cancelled" ? `
                <div class="order-progress">
                    <div class="progress-steps">
                        ${progressSteps.map((label, i) => {
                let cls = "";
                if (i < stepIdx) cls = "done";
                if (i === stepIdx) cls = "active";
                return `
                            <div class="progress-step ${cls}">
                                <div class="step-dot">${i < stepIdx ? '<i class="fas fa-check" style="font-size:0.55rem"></i>' : i + 1}</div>
                                <span class="step-label">${label}</span>
                            </div>`;
            }).join("")}
                    </div>
                </div>` : "";

            return `
                <div class="order-card">
                    <div class="order-top">
                        <div>
                            <div class="order-product">${order.product_name}</div>
                            <div class="order-meta">
                                <span><i class="fas fa-user"></i> ${order.shopper_name || "—"}</span>
                                <span><i class="fas fa-dollar-sign"></i> Total: ${order.currency || "₦"}${parseFloat(total).toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="status-badge ${config.class}">
                            <span class="status-dot"></span>${config.label}
                        </div>
                    </div>
                    ${progressHTML}
                    <div class="order-actions">
                        ${canPay ? `
                            <button class="btn-pay" onclick="makePayment('${order.id}', '${order.shopper_name}', ${total})">
                                <i class="fas fa-credit-card"></i> Make Payment
                            </button>` : ""}
                        ${isDelivered ? `
                            <button class="btn-review" onclick="leaveReview('${order.shopper_id}', '${order.shopper_name}')">
                                <i class="fas fa-star"></i> Leave a Review
                            </button>` : ""}
                        <span class="order-date">${new Date(order.created_at).toLocaleDateString()}</span>
                    </div>
                </div>`;
        }

        /* ─── PAYSTACK ─── */
        window.makePayment = function (orderId, shopperName, totalAmount) {
            if (paymentInProgress) return;
            paymentInProgress = true;

            var handler = PaystackPop.setup({
                key: PAYSTACK_PUBLIC_KEY,
                email: currentUser.email,
                amount: Math.round(totalAmount * 100),
                currency: "NGN",
                ref: "BFM_" + orderId + "_" + Date.now(),

                callback: function (response) {
                    document.getElementById("processingOverlay").classList.add("show");
                    handlePaymentSuccess(orderId, response.reference);
                },

                onClose: function () {
                    paymentInProgress = false;
                }
            });

            handler.openIframe();
        };

        async function handlePaymentSuccess(orderId, reference) {
            try {
                const { data, error } = await supabase.functions.invoke("verify_paystack_payment", {
                    body: { order_id: orderId, reference }
                });

                document.getElementById("processingOverlay").classList.remove("show");
                paymentInProgress = false;

                if (error) {
                    console.error("Payment verify function error:", error);
                    alert(
                        "Payment received but could not be verified on the server yet.\n\n" +
                        "Please contact support with ref: " + reference
                    );
                } else {
                    showSuccessBanner();
                    // Realtime will re-render the card automatically
                }
            } catch (err) {
                console.error("Unexpected payment update error:", err);
                document.getElementById("processingOverlay").classList.remove("show");
                paymentInProgress = false;
                alert("Payment received but something went wrong. Contact support with ref: " + reference);
            }
        }

        function showSuccessBanner() {
            const old = document.getElementById("successBanner");
            if (old) old.remove();

            const banner = document.createElement("div");
            banner.id = "successBanner";
            banner.style.cssText = `
                position:fixed;top:70px;left:50%;transform:translateX(-50%);
                background:#1a9e6e;color:white;padding:14px 28px;border-radius:10px;
                font-size:0.9rem;font-weight:600;font-family:'Sora',sans-serif;
                z-index:3000;box-shadow:0 4px 20px rgba(26,158,110,0.35);
                display:flex;align-items:center;gap:10px;animation:slideDown 0.3s ease;
            `;
            banner.innerHTML = `<i class="fas fa-check-circle"></i> Payment confirmed! Your shopper has been notified.`;
            document.body.appendChild(banner);

            setTimeout(() => {
                banner.style.transition = "opacity 0.4s";
                banner.style.opacity = "0";
                setTimeout(() => banner.remove(), 400);
            }, 4000);
        }

        /* ─── REVIEW MODAL ─── */
        window.leaveReview = function (shopperId, shopperName) {
            selectedShopperId = shopperId;
            selectedShopperName = shopperName;
            selectedStars = 0;
            document.getElementById("reviewShopperName").textContent = shopperName;
            document.getElementById("reviewText").value = "";
            document.getElementById("reviewError").style.display = "none";
            document.getElementById("reviewModal").style.display = "flex";
            setStars(0);
        };

        window.closeReviewModal = function () {
            document.getElementById("reviewModal").style.display = "none";
        };

        window.setStars = function (n) {
            selectedStars = n;
            document.querySelectorAll("#starPicker span").forEach((s, i) => {
                s.style.color = i < n ? "#f59e0b" : "#dde8e4";
            });
        };

        window.submitReview = async function () {
            const text = document.getElementById("reviewText").value.trim();
            const btn = document.getElementById("reviewSubmitBtn");
            const err = document.getElementById("reviewError");

            if (selectedStars === 0 || !text) {
                err.textContent = "Please provide a star rating and a review.";
                err.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Submitting...";

            const { error } = await supabase.from("reviews").insert({
                shopper_id: selectedShopperId,
                buyer_id: currentUser.uid,
                buyer_name: currentUser.name,
                stars: selectedStars,
                text: text
            });

            if (error) {
                alert("Review failed. Please try again.");
                btn.disabled = false;
                btn.textContent = "Submit Review";
            } else {
                alert("✅ Review submitted! Thank you.");
                window.closeReviewModal();
                btn.disabled = false;
                btn.textContent = "Submit Review";
            }
        };

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>

</html>
