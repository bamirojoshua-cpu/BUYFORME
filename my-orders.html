<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <meta name="theme-color" content="#1a9e6e">
    <title>My Orders | BuyForMe</title>
    <meta name="description" content="Track your BuyForMe orders, pay securely, and manage deliveries.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/buyer-theme.css">
    <link rel="stylesheet" href="css/buyer-shell.css">
    <link rel="stylesheet" href="css/buyer-orders.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BuyForMe">
    <link rel="apple-touch-icon" href="images/pwa/icon-192.png">
    <link rel="stylesheet" href="css/pwa.css">
    <script src="https://js.paystack.co/v1/inline.js"></script>
</head>

<body class="buyer-app" data-buyer-tab="orders">

    <div id="buyer-content">
        <header class="buyer-page-head buyer-animate-in">
            <h1 data-i18n="orders.title">My orders</h1>
            <p id="pageSubtitle" data-i18n="orders.subtitle">Track purchases and pay when your shopper accepts</p>
        </header>

        <div class="orders-filter-tabs buyer-animate-in">
            <button type="button" class="chip-pill active" onclick="filterOrders('all', this)">All</button>
            <button type="button" class="chip-pill" onclick="filterOrders('active', this)">Active</button>
            <button type="button" class="chip-pill" onclick="filterOrders('delivering', this)">In transit</button>
            <button type="button" class="chip-pill" onclick="filterOrders('delivered', this)">Delivered</button>
            <button type="button" class="chip-pill" onclick="filterOrders('pending', this)">Pending</button>
        </div>

        <p class="orders-meta" id="ordersMeta"></p>
        <div class="orders-list" id="ordersList"></div>
    </div>

    <script type="module" src="css/js/my-orders.js"></script>
    <script type="module" src="css/js/pwa-register.js"></script>
</body>

</html>
