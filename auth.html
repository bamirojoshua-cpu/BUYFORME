<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyForMe | Login & Sign Up</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="images/logo.png" type="image/png">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green: #1a9e6e;
            --green-dark: #127a54;
            --green-light: #e6f7f1;
            --text: #0f1c18;
            --text-muted: #5a7268;
            --border: #dde8e4;
            --bg: #eef5f2;
            --white: #ffffff;
            --red: #ef4444;
            --radius-lg: 28px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --radius-pill: 999px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 520px;
            height: 520px;
            top: -180px;
            right: -120px;
            background: radial-gradient(circle, rgba(26, 158, 110, 0.18) 0%, transparent 70%);
        }

        body::after {
            width: 440px;
            height: 440px;
            bottom: -160px;
            left: -100px;
            background: radial-gradient(circle, rgba(18, 122, 84, 0.12) 0%, transparent 70%);
        }

        /* ── PAGE ── */
        .auth-page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .auth-card {
            width: 100%;
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 36px 36px 32px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow:
                0 24px 64px rgba(12, 26, 20, 0.1),
                0 0 0 1px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.3s ease;
        }

        .auth-card:hover {
            box-shadow:
                0 28px 72px rgba(12, 26, 20, 0.12),
                0 0 0 1px rgba(26, 158, 110, 0.08);
        }

        /* ── BRAND — above card, large & prominent ── */
        .auth-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0;
        }

        .auth-brand .brand-link:has(.brand-logo) {
            --logo-circle: 112px;
            width: var(--logo-circle);
            height: var(--logo-circle);
            min-width: var(--logo-circle);
            max-width: var(--logo-circle);
            padding: 12px;
            margin-bottom: 16px;
            background: #fff;
            border: 3px solid rgba(26, 158, 110, 0.25);
            box-shadow:
                0 16px 48px rgba(26, 158, 110, 0.28),
                0 4px 16px rgba(12, 26, 20, 0.12),
                0 0 0 6px rgba(255, 255, 255, 0.9);
            transition:
                transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .auth-brand .brand-link:has(.brand-logo):hover {
            transform: translateY(-3px) scale(1.04);
            border-color: rgba(26, 158, 110, 0.5);
            box-shadow:
                0 20px 56px rgba(26, 158, 110, 0.38),
                0 6px 20px rgba(12, 26, 20, 0.14),
                0 0 0 6px rgba(255, 255, 255, 1),
                0 0 40px rgba(26, 158, 110, 0.2);
        }

        .auth-brand-name {
            font-family: 'Sora', sans-serif;
            font-size: clamp(1.75rem, 5vw, 2.15rem);
            font-weight: 700;
            color: var(--green-dark);
            letter-spacing: -0.8px;
            line-height: 1.1;
        }

        .auth-card h1 {
            font-family: 'Sora', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 26px;
            text-align: center;
            line-height: 1.5;
        }

        /* ── TABS ── */
        .tab-group {
            display: flex;
            background: var(--bg);
            border-radius: var(--radius-pill);
            padding: 5px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            gap: 4px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 16px;
            border-radius: var(--radius-pill);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition:
                background 0.2s ease,
                color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
            user-select: none;
        }

        .tab:hover:not(.active) {
            color: var(--text);
            background: rgba(255, 255, 255, 0.6);
        }

        .tab.active {
            background: var(--white);
            color: var(--green-dark);
            box-shadow: 0 2px 10px rgba(12, 26, 20, 0.08);
        }

        /* ── ROLE SELECTOR ── */
        .role-section {
            display: none;
            margin-bottom: 16px;
        }

        .role-section.show {
            display: block;
        }

        .role-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .role-option {
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 12px;
            cursor: pointer;
            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
            text-align: center;
            user-select: none;
            background: var(--white);
        }

        .role-option:hover {
            border-color: var(--green);
            background: var(--green-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(26, 158, 110, 0.12);
        }

        .role-option.selected {
            border-color: var(--green);
            background: var(--green-light);
            box-shadow: 0 0 0 1px rgba(26, 158, 110, 0.2);
        }

        .role-icon {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .role-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
        }

        .role-option.selected .role-title {
            color: var(--green-dark);
        }

        .role-sub {
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        /* ── NAME SECTION ── */
        .name-section {
            display: none;
            margin-bottom: 0;
        }

        .name-section.show {
            display: block;
        }

        /* ── FORM GROUPS ── */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.92rem;
            color: var(--text);
            background: var(--white);
            outline: none;
            font-family: 'Inter', sans-serif;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .form-group input:hover {
            border-color: #c5d9d2;
            background: #fafcfb;
        }

        .form-group input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(26, 158, 110, 0.15);
        }

        /* ── ERROR ── */
        .error-msg {
            font-size: 0.82rem;
            color: var(--red);
            background: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin-bottom: 14px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        /* ── SUBMIT ── */
        .btn-auth {
            width: 100%;
            padding: 14px;
            background: var(--green);
            color: white;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Sora', sans-serif;
            margin-top: 4px;
            transition:
                background 0.2s ease,
                transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.25s ease;
        }

        .btn-auth:hover:not(:disabled) {
            background: var(--green-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(26, 158, 110, 0.35);
        }

        .btn-auth:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        .btn-auth:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* ── FOOTER ── */
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--green);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s ease;
        }

        .auth-footer a:hover {
            color: var(--green-dark);
            text-decoration: underline;
        }

        @media (prefers-reduced-motion: reduce) {

            .auth-brand .brand-link:has(.brand-logo):hover,
            .role-option:hover,
            .btn-auth:hover:not(:disabled) {
                transform: none;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 14px;
                align-items: flex-start;
                padding-top: 32px;
            }

            .auth-card {
                padding: 32px 24px 28px;
                border-radius: 24px;
            }

            .auth-page {
                gap: 22px;
            }

            .auth-brand .brand-link:has(.brand-logo) {
                --logo-circle: 92px;
                padding: 10px;
            }

            .auth-brand-name {
                font-size: 1.65rem;
            }
        }
    </style>
</head>

<body>

    <div class="auth-page">

        <header class="auth-brand">
            <a href="index.html" class="brand-link" aria-label="BuyForMe home">
                <img src="images/logo.png" alt="" class="brand-logo">
            </a>
            <span class="auth-brand-name">BuyForMe</span>
        </header>

        <div class="auth-card">

            <h1 id="authTitle">Welcome back</h1>
            <p class="auth-subtitle" id="authSubtitle">Log in to your BuyForMe account</p>

            <!-- TABS -->
            <div class="tab-group">
                <div class="tab active" id="loginTab">Login</div>
                <div class="tab" id="signupTab">Sign Up</div>
            </div>

            <!-- ERROR MESSAGE -->
            <div class="error-msg" id="errorMsg"></div>

            <!-- ROLE SELECTOR — signup only -->
            <div class="role-section" id="roleSection">
                <span class="role-label">I want to join as a:</span>
                <div class="role-selector">
                    <div class="role-option selected" data-role="buyer">
                        <div class="role-icon">🛒</div>
                        <div class="role-title">Buyer</div>
                        <div class="role-sub">I want to buy from abroad</div>
                    </div>
                    <div class="role-option" data-role="shopper">
                        <div class="role-icon">🧳</div>
                        <div class="role-title">Shopper</div>
                        <div class="role-sub">I shop on behalf of buyers</div>
                    </div>
                </div>
            </div>

            <!-- FORM -->
            <form id="authForm">

                <!-- NAME — signup only -->
                <div class="name-section" id="nameSection">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName" placeholder="e.g. Aisha Musa">
                    </div>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="you@email.com" required>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Min. 6 characters" required>
                </div>

                <!-- SUBMIT -->
                <button type="submit" class="btn-auth" id="authBtn">Login</button>

            </form>

            <!-- FOOTER -->
            <p class="auth-footer" id="authFooter">
                Don't have an account? <a href="#" id="switchToSignup">Sign up free</a>
            </p>

        </div>
    </div>

    <script type="module" src="css/js/auth.js"></script>
</body>

</html>
