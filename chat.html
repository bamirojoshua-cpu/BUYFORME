<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | BuyForMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/buyer-theme.css">
    <link rel="stylesheet" href="css/buyer-shell.css">
    <link rel="stylesheet" href="css/buyer-chat.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="stylesheet" href="css/call-ui.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="images/logo.png" type="image/png">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green: #1a9e6e;
            --green-dark: #127a54;
            --green-light: #e6f7f1;
            --text: #0f1c18;
            --text-muted: #5a7268;
            --border: #dde8e4;
            --bg: #f4f8f6;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .navbar {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .logo {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--green);
            text-decoration: none;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.83rem;
            color: var(--text-muted);
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.15s;
        }

        .back-link:hover {
            border-color: var(--green);
            color: var(--green);
        }

        .nav-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--green);
            color: white;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .conv-sidebar {
            width: 320px;
            flex-shrink: 0;
            background: var(--white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .conv-sidebar-header {
            padding: 16px 18px;
            font-family: 'Sora', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            color: var(--text);
        }

        .conv-search {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .conv-search input {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.82rem;
            outline: none;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
        }

        .conv-search input:focus {
            border-color: var(--green);
        }

        .conv-list {
            overflow-y: auto;
            flex: 1;
        }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        .conv-item:hover {
            background: var(--bg);
        }

        .conv-item.active {
            background: var(--green-light);
        }

        .conv-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--green);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .conv-info {
            flex: 1;
            min-width: 0;
        }

        .conv-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .conv-name {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text);
        }

        .conv-time {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .conv-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .conv-preview {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .conv-unread {
            background: var(--green);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        .conv-empty {
            padding: 40px 18px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.7;
        }

        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }

        .chat-empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 12px;
        }

        .chat-empty-state .icon {
            font-size: 3.5rem;
        }

        .chat-empty-state h3 {
            font-family: 'Sora', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
        }

        .chat-empty-state p {
            font-size: 0.85rem;
        }

        .chat-header {
            padding: 14px 20px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--green);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-name {
            font-family: 'Sora', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .chat-header-sub {
            font-size: 0.72rem;
            color: var(--green);
            margin-top: 1px;
        }

        /* Call buttons in header */
        .call-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--green-light);
            border: 1px solid var(--border);
            color: var(--green);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: background 0.15s;
        }

        .call-btn:hover {
            background: var(--green);
            color: white;
        }

        .call-btns {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .msg-row.mine {
            flex-direction: row-reverse;
        }

        .msg-row.theirs {
            flex-direction: row;
        }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--green);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .msg-bubble {
            max-width: 62%;
            padding: 10px 14px;
            border-radius: 18px;
            word-break: break-word;
        }

        .bubble-mine {
            background: var(--green);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bubble-theirs {
            background: var(--white);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg-content {
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .msg-time {
            font-size: 0.63rem;
            margin-top: 4px;
            opacity: 0.65;
            text-align: right;
        }

        .msg-date-divider {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin: 8px 0;
        }

        .chat-input-row {
            padding: 10px 16px;
            background: var(--white);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .input-action-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .input-action-btn:hover {
            border-color: var(--green);
            color: var(--green);
            background: var(--green-light);
        }

        .chat-input-row input {
            flex: 1;
            padding: 11px 18px;
            border: 1.5px solid var(--border);
            border-radius: 24px;
            font-size: 0.9rem;
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.15s;
            background: var(--bg);
        }

        .chat-input-row input:focus {
            border-color: var(--green);
            background: var(--white);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--green);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: var(--green-dark);
        }

        .loading-msg {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            .conv-sidebar {
                width: 100%;
                position: absolute;
                height: calc(100% - 62px);
                z-index: 10;
            }

            .conv-sidebar.hidden {
                display: none;
            }

            .chat-window {
                width: 100%;
            }

            .back-to-list {
                display: flex !important;
            }
        }

        .back-to-list {
            display: none;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
        }
    </style>
</head>

<body class="buyer-app buyer-app--chat" data-buyer-tab="messages">
    <div id="buyer-content" class="buyer-main-inner buyer-main-inner--chat">
    <div class="chat-layout">

        <div class="conv-sidebar" id="convSidebar">
            <div class="conv-sidebar-header">💬 Messages</div>
            <div class="conv-search">
                <input type="text" id="convSearch" placeholder="Search conversations...">
            </div>
            <div class="conv-list" id="convList">
                <div class="loading-msg">Loading conversations...</div>
            </div>
        </div>

        <div class="chat-window" id="chatWindow">

            <div class="chat-empty-state" id="chatEmptyState">
                <div class="icon">💬</div>
                <h3>Your Messages</h3>
                <p>Select a conversation or message a shopper from their profile.</p>
            </div>

            <div class="chat-header" id="chatHeader" style="display:none">
                <button class="back-to-list" id="backToList" onclick="showConvList()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="chat-header-avatar" id="chatHeaderAvatar">?</div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="chatHeaderName">—</div>
                    <div class="chat-header-sub" id="chatHeaderSub">Shopper</div>
                </div>
                <!-- Voice call + Video call buttons -->
                <div class="call-btns">
                    <button class="call-btn" onclick="startVoiceCall()" title="Start voice call">
                        <i class="fas fa-phone"></i>
                    </button>
                    <button class="call-btn" onclick="startVideoCall()" title="Start video call">
                        <i class="fas fa-video"></i>
                    </button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages" style="display:none"></div>

            <div class="chat-input-row" id="chatInputRow" style="display:none">
                <input type="file" id="imageFileInput" accept="image/*" style="display:none"
                    onchange="handleImageUpload(event)">
                <button class="input-action-btn" onclick="triggerImageUpload()" title="Send image">
                    <i class="fas fa-image"></i>
                </button>
                <button class="input-action-btn" id="voiceBtn" onclick="toggleVoiceRecord()" title="Record voice note">
                    <i class="fas fa-microphone"></i>
                </button>
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>

        </div>
    </div>
    </div>

    <script type="module" src="css/js/chat.js"></script>
</body>

</html>
