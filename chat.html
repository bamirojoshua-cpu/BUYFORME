<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | BuyForMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/buyer-theme.css">
    <link rel="stylesheet" href="css/buyer-shell.css">
    <link rel="stylesheet" href="css/verified-badge.css">
    <link rel="stylesheet" href="css/buyer-chat.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="stylesheet" href="css/call-ui.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>

<body class="buyer-app buyer-app--chat" data-buyer-tab="messages">

    <div id="buyer-content" class="buyer-main-inner buyer-main-inner--chat">
        <div class="chat-layout">

            <aside class="conv-sidebar" id="convSidebar" aria-label="Conversations">
                <header class="conv-sidebar__head">
                    <h1 class="conv-sidebar__title"><i class="fas fa-message" aria-hidden="true"></i> Messages</h1>
                </header>
                <div class="conv-search-wrap">
                    <i class="fas fa-magnifying-glass conv-search__icon" aria-hidden="true"></i>
                    <input type="search" id="convSearch" class="conv-search__input" placeholder="Search conversations…" autocomplete="off">
                </div>
                <div class="conv-list" id="convList" role="list">
                    <div class="conv-loading">Loading conversations…</div>
                </div>
            </aside>

            <section class="chat-window" id="chatWindow" aria-label="Conversation">

                <div class="chat-empty-state" id="chatEmptyState">
                    <div class="chat-empty-state__icon" aria-hidden="true">
                        <i class="fas fa-comments"></i>
                    </div>
                    <h2>Your messages</h2>
                    <p>Select a conversation on the left, or message a shopper from their profile.</p>
                    <a href="buyers.html" class="btn-pill btn-pill--secondary chat-empty-state__cta">
                        <i class="fas fa-compass" aria-hidden="true"></i> Discover shoppers
                    </a>
                </div>

                <div class="chat-thread" id="chatThread" hidden>
                <header class="chat-header" id="chatHeader">
                    <button type="button" class="chat-header__back" id="backToList" onclick="showConvList()" aria-label="Back to conversations">
                        <i class="fas fa-arrow-left" aria-hidden="true"></i>
                    </button>
                    <a href="#" class="chat-header__avatar-link" id="chatHeaderProfileLink" aria-label="View profile">
                        <div class="chat-header__avatar" id="chatHeaderAvatar" aria-hidden="true">?</div>
                    </a>
                    <div class="chat-header__info">
                        <h2 class="chat-header__name" id="chatHeaderName"></h2>
                        <p class="chat-header__sub" id="chatHeaderSub">Shopper</p>
                    </div>
                    <div class="chat-header__actions">
                        <button type="button" class="chat-action-btn" onclick="startVoiceCall()" title="Voice call" aria-label="Voice call">
                            <i class="fas fa-phone" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="chat-action-btn" onclick="startVideoCall()" title="Video call" aria-label="Video call">
                            <i class="fas fa-video" aria-hidden="true"></i>
                        </button>
                    </div>
                </header>

                <div class="chat-messages" id="chatMessages" role="log" aria-live="polite"></div>

                <footer class="chat-composer" id="chatInputRow">
                    <input type="file" id="imageFileInput" accept="image/*" hidden onchange="handleImageUpload(event)">
                    <div class="chat-composer__inner">
                        <button type="button" class="composer-btn" onclick="triggerImageUpload()" title="Send image" aria-label="Send image">
                            <i class="fas fa-image" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="composer-btn" id="voiceBtn" onclick="toggleVoiceRecord()" title="Voice note" aria-label="Record voice note">
                            <i class="fas fa-microphone" aria-hidden="true"></i>
                        </button>
                        <input type="text" id="messageInput" class="chat-composer__input" placeholder="Type a message…" autocomplete="off">
                        <button type="button" class="composer-send" id="sendBtn" aria-label="Send message">
                            <i class="fas fa-paper-plane" aria-hidden="true"></i>
                        </button>
                    </div>
                </footer>
                </div>

            </section>
        </div>
    </div>

    <script type="module" src="css/js/chat.js"></script>
</body>

</html>
