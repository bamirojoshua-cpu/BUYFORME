<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a9e6e">
    <title>Cart | BuyForMe</title>
    <meta name="description" content="Review items in your BuyForMe cart and submit requests to your shopper.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/buyer-theme.css">
    <link rel="stylesheet" href="css/buyer-shell.css">
    <link rel="stylesheet" href="css/wishlist-cart.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BuyForMe">
    <link rel="apple-touch-icon" href="images/pwa/icon-192.png">
    <link rel="stylesheet" href="css/pwa.css">
</head>
<body class="buyer-app" data-buyer-tab="cart">
    <div id="buyer-content">
        <header class="buyer-page-head buyer-animate-in">
            <h1>Shopping cart</h1>
            <p>Items grouped by shopper — checkout sends separate requests (no payment until accepted).</p>
        </header>
        <div id="cartContent" aria-live="polite"></div>
    </div>
    <script type="module" src="css/js/cart-page.js"></script>
    <script type="module" src="css/js/pwa-register.js"></script>
</body>
</html>
