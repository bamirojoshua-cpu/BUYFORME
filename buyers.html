<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuyForMe | Buyer Dashboard</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/buyers.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="icon" href="images/logo.png" type="image/png">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="index.html" class="brand-link logo"><img src="images/logo.png" alt="BuyForMe" class="brand-logo"></a>

        <div class="nav-right">

            <div class="nav-icon" title="Notifications">

                🔔<span class="notif-dot"></span>

            </div>

            <div class="nav-icon" onclick="window.location.href='chat.html'">💬</div>

            <div class="user-avatar" id="userAvatar" title="Account Settings" onclick="toggleSettings()">B</div>

            <button class="logout-btn" onclick="handleLogout()">Log Out</button>

        </div>

    </nav>

    <!-- SETTINGS PANEL -->

    <div class="settings-overlay" id="settingsOverlay" onclick="closeSettings(event)">

        <div class="settings-panel">

            <div class="settings-header">

                <h2>Account Settings</h2>

                <button class="close-btn" onclick="toggleSettings()">✕</button>

            </div>

            <nav>

                <button class="s-nav-btn active" onclick="switchTab('profile')">Profile</button>

                <button class="s-nav-btn" onclick="switchTab('shipping')">Shipping Address</button>

                <button class="s-nav-btn" onclick="switchTab('payments')">Payment Methods</button>

            </nav>

            <div class="settings-form" id="settingsForm">

                <!-- DEFAULT: Profile tab shown on open -->

                <label>Full Name</label>

                <input type="text" id="settingName" placeholder="Enter your name">

                <label>Email Address</label>

                <input type="email" id="settingEmail" placeholder="Enter your email">

                <button class="btn-save" onclick="saveProfile()">Save Changes</button>

                <div id="profileMsg" style="margin-top:12px;font-size:0.85rem;"></div>

            </div>

        </div>

    </div>

    <!-- MAIN -->

    <main class="container">

        <!-- WELCOME BANNER -->

        <section class="welcome-banner">

            <div>

                <h1 id="welcomeMsg">Welcome back</h1>

                <p>Find a verified personal shopper to buy from abroad — fast and trusted.</p>

            </div>

            <button class="btn-orders" onclick="window.location.href='my-orders.html'">My Orders</button>

        </section>

        <!-- SEARCH & FILTERS -->

        <section class="search-section">

            <input type="text" id="searchBar" class="search-bar"
                placeholder="Search by name, location, or specialty...">

            <div class="filters" id="filterPills"></div>

        </section>

        <!-- SHOPPER GRID -->

        <h2 class="section-title">

            Verified Shoppers

            <span class="result-count" id="resultCount"></span>

        </h2>

        <div class="shopper-grid" id="shopperGrid"></div>

    </main>

    <script type="module" src="css/js/buyers.js"></script>

</body>

</html>
