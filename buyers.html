<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Shoppers | BuyForMe</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/verified-badge.css">
    <link rel="stylesheet" href="css/buyers.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>

<body class="buyers-page">

    <div class="buyers-bg" aria-hidden="true"></div>

    <header class="buyers-nav navbar">
        <a href="index.html" class="brand-link logo" aria-label="BuyForMe home">
            <img src="images/logo.png" alt="BuyForMe" class="brand-logo">
        </a>

        <div class="buyers-nav__actions">
            <a href="my-orders.html" class="nav-pill nav-pill--ghost" title="My orders">
                <i class="fas fa-bag-shopping"></i>
                <span class="nav-pill__label">Orders</span>
            </a>
            <a href="chat.html" class="nav-icon-btn" title="Messages" aria-label="Messages">
                <i class="fas fa-message"></i>
            </a>
            <button type="button" class="nav-avatar" id="userAvatar" title="Account settings"
                onclick="toggleSettings()" aria-label="Open account settings"></button>
            <button type="button" class="nav-logout" onclick="handleLogout()">
                <i class="fas fa-right-from-bracket"></i>
                <span>Log out</span>
            </button>
        </div>
    </header>

    <!-- Settings drawer -->
    <div class="settings-overlay" id="settingsOverlay" onclick="closeSettings(event)" aria-hidden="true">
        <aside class="settings-panel" role="dialog" aria-labelledby="settingsTitle" onclick="event.stopPropagation()">
            <div class="settings-panel__head">
                <div>
                    <p class="settings-panel__eyebrow">Your account</p>
                    <h2 id="settingsTitle">Settings</h2>
                </div>
                <button type="button" class="settings-close" onclick="toggleSettings()" aria-label="Close settings">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>

            <nav class="settings-tabs" aria-label="Settings sections">
                <button type="button" class="settings-tab active" data-tab="profile" onclick="switchTab('profile')">
                    <i class="fas fa-user"></i> Profile
                </button>
                <button type="button" class="settings-tab" data-tab="shipping" onclick="switchTab('shipping')">
                    <i class="fas fa-location-dot"></i> Shipping
                </button>
                <button type="button" class="settings-tab" data-tab="payments" onclick="switchTab('payments')">
                    <i class="fas fa-wallet"></i> Payments
                </button>
            </nav>

            <div class="settings-form" id="settingsForm">
                <label for="settingName">Full name</label>
                <input type="text" id="settingName" placeholder="Your name" autocomplete="name">
                <label for="settingEmail">Email</label>
                <input type="email" id="settingEmail" placeholder="you@email.com" autocomplete="email">
                <button type="button" class="btn-save" onclick="saveProfile()">
                    <i class="fas fa-check"></i> Save changes
                </button>
                <p class="settings-msg" id="profileMsg" role="status"></p>
            </div>
        </aside>
    </div>

    <main class="buyers-main">
        <section class="hero" aria-labelledby="welcomeMsg">
            <div class="hero__copy">
                <span class="hero__badge"><i class="fas fa-shield-halved"></i> Verified shoppers only</span>
                <h1 id="welcomeMsg">Welcome back</h1>
                <p class="hero__sub">Shop abroad with trusted personal shoppers — browse, request, and track in one place.</p>
            </div>
            <div class="hero__actions">
                <a href="my-orders.html" class="hero-cta hero-cta--primary">
                    <i class="fas fa-box"></i> My orders
                </a>
                <a href="chat.html" class="hero-cta hero-cta--secondary">
                    <i class="fas fa-comments"></i> Messages
                </a>
            </div>
        </section>

        <section class="discover" aria-label="Find shoppers">
            <div class="discover__toolbar">
                <label class="search-field" for="searchBar">
                    <i class="fas fa-magnifying-glass search-field__icon" aria-hidden="true"></i>
                    <input type="search" id="searchBar" class="search-bar"
                        placeholder="Search name, city, or specialty…" autocomplete="off">
                </label>
                <div class="filters-scroll">
                    <div class="filters" id="filterPills" role="tablist" aria-label="Filter shoppers"></div>
                </div>
            </div>

            <div class="discover__header">
                <h2 class="section-title">
                    <i class="fas fa-users"></i>
                    Verified shoppers
                </h2>
                <span class="result-count" id="resultCount" aria-live="polite"></span>
            </div>

            <div class="shopper-grid" id="shopperGrid" aria-busy="true"></div>
        </section>
    </main>

    <script type="module" src="css/js/buyers.js"></script>
</body>

</html>
